# Render Blueprint: https://render.com/docs/blueprint-spec
# Push this file, then in https://dashboard.render.com/ → New → Blueprint (pick repo),
# or create a Web Service manually with the same build/start commands.

services:
  - type: web
    name: chofetz-chaim-shmiras-halashon
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_API_KEY
        sync: false
